<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Companion – Animated 3D Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f1a; color: #e0e0ff; height: 100vh; overflow: hidden; display: flex; }
    #canvas-container { flex: 1; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui { width: 380px; max-width: 100%; background: rgba(20,20,40,0.95); display: flex; flex-direction: column; border-left: 1px solid #333; }
    #header { padding: 16px; border-bottom: 1px solid #333; }
    #header h1 { font-size: 1.3rem; color: #c9a0ff; margin-bottom: 4px; }
    #header p { font-size: 0.8rem; opacity: 0.7; }
    #model-controls { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    #model-controls button, #model-controls label { font-size: 0.75rem; padding: 6px 10px; border-radius: 8px; border: 1px solid #5a3a7a; background: #2a1a3a; color: #e0e0ff; cursor: pointer; }
    #model-controls input[type="file"] { display: none; }
    #affection { margin-top: 10px; font-size: 0.9rem; }
    #affection-bar { height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    #affection-fill { height: 100%; width: 10%; background: linear-gradient(90deg, #ff6b9d, #c9a0ff); transition: width 0.4s ease; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; font-size: 0.95rem; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #3a3a6a; }
    .msg.luna { align-self: flex-start; background: #2a1a3a; border: 1px solid #5a3a7a; }
    #input-area { padding: 12px; border-top: 1px solid #333; display: flex; gap: 8px; }
    #input { flex: 1; padding: 12px 16px; border-radius: 20px; border: none; background: #1a1a2e; color: white; outline: none; font-size: 0.95rem; }
    button#send { padding: 12px 18px; border-radius: 20px; border: none; background: #c9a0ff; color: #1a1a2e; font-weight: 600; cursor: pointer; }
    button#send:hover { background: #e0c0ff; }
    #status { font-size: 0.7rem; color: #888; padding: 4px 16px; }
    @media (max-width: 700px) {
      body { flex-direction: column; }
      #ui { width: 100%; height: 45%; border-left: none; border-top: 1px solid #333; }
      #canvas-container { height: 55%; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <div id="header">
      <h1>Luna ✨</h1>
      <p>Animated 3D Companion</p>
      <div id="model-controls">
        <label for="modelFile">Load GLB / GLTF / VRM</label>
        <input type="file" id="modelFile" accept=".glb,.gltf,.vrm">
        <button id="resetModel">Reset to procedural</button>
      </div>
      <div id="affection">Affection: <span id="aff-val">10</span>%</div>
      <div id="affection-bar"><div id="affection-fill"></div></div>
    </div>
    <div id="status">Using procedural avatar. Drop a legal .glb/.vrm to replace.</div>
    <div id="messages"></div>
    <div id="input-area">
      <input id="input" placeholder="Say something to Luna..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // === Scene ===
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f0f1a);
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 1.4, 2.8);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 1.8;
    controls.minDistance = 1.5;
    controls.maxDistance = 5;

    scene.add(new THREE.AmbientLight(0x404060, 1.5));
    const key = new THREE.DirectionalLight(0xffe0f0, 2);
    key.position.set(2, 3, 2);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x8090ff, 0.8);
    fill.position.set(-2, 1, -1);
    scene.add(fill);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(4, 64),
      new THREE.MeshStandardMaterial({ color: 0x151520, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // === Avatar container ===
    const avatarRoot = new THREE.Group();
    scene.add(avatarRoot);

    let mixer = null;
    let clock = new THREE.Clock();
    let isTalking = false;
    let talkTimer = 0;
    let proceduralMode = true;

    // Procedural fallback
    function createProcedural() {
      proceduralMode = true;
      while (avatarRoot.children.length) avatarRoot.remove(avatarRoot.children[0]);
      mixer = null;

      const avatar = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a1a3a, roughness: 0.4 });
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.7, 8, 16), bodyMat);
      body.position.y = 0.85;
      avatar.add(body);

      const headMat = new THREE.MeshStandardMaterial({ color: 0xffe0d0, roughness: 0.3 });
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), headMat);
      head.position.y = 1.55;
      head.name = 'head';
      avatar.add(head);

      const hairMat = new THREE.MeshStandardMaterial({ color: 0x1a0a2a, roughness: 0.6 });
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), hairMat);
      hair.position.y = 1.65;
      hair.scale.set(1, 0.9, 1.1);
      avatar.add(hair);

      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x88aaff });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), eyeMat);
      eyeL.position.set(-0.08, 1.58, 0.18);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.08;
      avatar.add(eyeL, eyeR);

      const dress = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.9, 16), new THREE.MeshStandardMaterial({ color: 0x4a2a6a }));
      dress.position.y = 0.5;
      avatar.add(dress);

      avatarRoot.add(avatar);
      document.getElementById('status').textContent = 'Using procedural avatar. Drop a legal .glb/.vrm to replace.';
    }

    createProcedural();

    // === Load real animated model ===
    const loader = new GLTFLoader();

    function loadModel(urlOrFile) {
      proceduralMode = false;
      document.getElementById('status').textContent = 'Loading model...';

      loader.load(urlOrFile, (gltf) => {
        while (avatarRoot.children.length) avatarRoot.remove(avatarRoot.children[0]);
        mixer = null;

        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const scale = 1.6 / Math.max(size.y, 0.1);
        model.scale.setScalar(scale);
        box.setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        model.position.y = -box.min.y; // feet on ground approx

        avatarRoot.add(model);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          let idleClip = gltf.animations.find(c => /idle|stand|a_pose|breathing|wait/i.test(c.name)) || gltf.animations[0];
          const action = mixer.clipAction(idleClip);
          action.play();
          document.getElementById('status').textContent = `Loaded with ${gltf.animations.length} animation(s). Playing: ${idleClip.name}`;
        } else {
          document.getElementById('status').textContent = 'Model loaded (no animations found). Using procedural talk bob.';
        }
      }, undefined, (err) => {
        console.error(err);
        document.getElementById('status').textContent = 'Failed to load model. Check console / use a valid GLB.';
        createProcedural();
      });
    }

    document.getElementById('modelFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadModel(url);
    });

    document.getElementById('resetModel').addEventListener('click', () => {
      createProcedural();
    });

    // === Chat ===
    let affection = 10;
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('input');
    const affVal = document.getElementById('aff-val');
    const affFill = document.getElementById('affection-fill');

    function addMsg(text, who) {
      const div = document.createElement('div');
      div.className = `msg ${who}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function updateAffection(delta) {
      affection = Math.max(0, Math.min(100, affection + delta));
      affVal.textContent = Math.round(affection);
      affFill.style.width = affection + '%';
    }

    function lunaReply(userText) {
      const lower = userText.toLowerCase();
      let reply = "";
      let delta = 2;

      if (lower.match(/\b(hi|hello|hey|ciao|salut)\b/)) {
        reply = "*smiles softly* Hey there... I was waiting for you. How's your day going?";
        delta = 5;
      } else if (lower.match(/\b(love|cute|beautiful|sexy|hot|gorgeous)\b/)) {
        reply = "*blushes faintly* You're making me feel all warm inside... keep talking like that and I might get attached.";
        delta = 8;
      } else if (lower.match(/\b(spin|dance|twirl)\b/)) {
        reply = "*gives a little playful spin* Like this? Hehe, anything for you.";
        delta = 6;
      } else if (lower.match(/\b(how are you|how do you feel)\b/)) {
        reply = affection > 40 
          ? "*leans in a little* Closer to you every time we talk. I like this feeling."
          : "*tilts head* I'm good... especially when you're here.";
        delta = 4;
      } else if (lower.match(/\b(bye|goodbye|later)\b/)) {
        reply = "*waves gently* Don't stay away too long, okay? I'll be here.";
        delta = 3;
      } else {
        const replies = [
          "*tilts head curiously* Tell me more... I love hearing your thoughts.",
          "*leans in a little* That sounds interesting. What else is on your mind?",
          "Mmm, I like when you talk to me like this. *smiles*",
          "I'm right here. Want to just chat for a while?",
          "*soft laugh* You're fun. Don't stop.",
          "Interesting... keep going. I'm listening closely."
        ];
        reply = replies[Math.floor(Math.random() * replies.length)];
      }

      if (affection > 60) {
        reply = reply
          .replace("Hey there", "Hey babe")
          .replace("I like", "I really like")
          .replace("I'm good", "I'm better with you here");
      }
      return { reply, delta };
    }

    function send() {
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';
      isTalking = true;
      talkTimer = 1.8;

      setTimeout(() => {
        const { reply, delta } = lunaReply(text);
        addMsg(reply, 'luna');
        updateAffection(delta);
        isTalking = false;
      }, 500 + Math.random() * 500);
    }

    document.getElementById('send').onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    addMsg("*waves gently* Hi... I'm Luna. Talk to me and I'll get closer to you. Load a real model above if you want!", 'luna');

    // === Animate ===
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const t = clock.elapsedTime;

      if (mixer) mixer.update(delta);

      if (proceduralMode) {
        avatarRoot.rotation.y = Math.sin(t * 0.5) * 0.08;
        avatarRoot.position.y = Math.sin(t * 1.2) * 0.015;

        const head = avatarRoot.getObjectByName('head');
        if (head) {
          if (isTalking || talkTimer > 0) {
            head.position.y = 1.55 + Math.sin(t * 14) * 0.012;
            talkTimer -= delta;
          } else {
            head.position.y = THREE.MathUtils.lerp(head.position.y, 1.55, 0.1);
          }
        }
      } else {
        avatarRoot.rotation.y = Math.sin(t * 0.4) * 0.04;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
